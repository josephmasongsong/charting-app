<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:100%;font-family:var(--font-sans);font-size:11px">
<div style="flex:1;background:var(--bch-green-600);color:#fff;display:flex;align-items:end;padding:6px">green-600<br>#28A745</div>
<div style="flex:1;background:var(--bch-green-500);color:#fff;display:flex;align-items:end;padding:6px">green-500<br>#16A660</div>
<div style="flex:1;background:var(--bch-gold-500);color:#212529;display:flex;align-items:end;padding:6px">gold-500 (current)<br>#E9B949</div>
<div style="flex:1;background:var(--bch-gold-400);color:#212529;display:flex;align-items:end;padding:6px">gold-400<br>#FAC747</div>
<div style="flex:1;background:var(--bch-red-600);color:#fff;display:flex;align-items:end;padding:6px">red-600<br>#E70000</div>
<div style="flex:1;background:var(--danger);color:#fff;display:flex;align-items:end;padding:6px">red-700 (danger)<br>#BA0F17</div>
