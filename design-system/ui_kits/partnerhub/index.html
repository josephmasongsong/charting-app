<!-- @dsCard group="PartnerHub" viewport="1200x720" name="PartnerHub" subtitle="Internal operations portal — dashboard, feedback wizard, staff directory, profile" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BC Housing — PartnerHub UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-muted)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./Dashboard.jsx"></script>
<script type="text/babel" src="./FeedbackWizard.jsx"></script>
<script type="text/babel" src="./StaffDirectory.jsx"></script>
<script type="text/babel" src="./Profile.jsx"></script>
<script type="text/babel">
const SCREENS = ["Dashboard", "Feedback Wizard", "Staff Directory", "Profile"];
function App(){
  const [screen, setScreen] = React.useState("Dashboard");
  const [sideActive, setSideActive] = React.useState("Standards and Elements");
  const [activePart, setActivePart] = React.useState(1);
  const [situation, setSituation] = React.useState(0);
  const staff = [
    { initials: "MH", name: "Michael Huynh", title: "Mgr, IT Programs", dept: "Enterprise Business Systems", branch: "Information Management & Technology", email: "mhuynh@bchousing.org", phone: "604-439-4140" },
    { initials: "DS", name: "Daisy Stapleton", title: "Programs Specialist (SHP)", dept: "Supportive Housing Programs", branch: "Operations", email: "dstaplet@bchousing.org", phone: "604-761-9674" },
    { initials: "JH", name: "Judy Hu", title: "Business Systems Analyst", dept: "Enterprise Business Systems", branch: "Information Management & Technology", email: "jhu@bchousing.org", phone: "604-439-4141" },
  ];
  return (
    <div>
      <div style={{ display: "flex", gap: 6, padding: "10px 16px", background: "#fff", borderBottom: "1px solid var(--border-default)", fontFamily: "var(--font-sans)" }}>
        {SCREENS.map((s) => (
          <button key={s} onClick={() => setScreen(s)} style={{
            fontFamily: "var(--font-sans)", fontSize: 13, padding: "6px 12px", borderRadius: 4, cursor: "pointer",
            border: `1px solid ${screen === s ? "var(--focus-ring)" : "var(--border-default)"}`,
            background: screen === s ? "var(--focus-ring)" : "#fff", color: screen === s ? "#fff" : "var(--text-body)",
          }}>{s}</button>
        ))}
      </div>
      {screen === "Dashboard" && <Dashboard sideActive={sideActive} onSideSelect={setSideActive} />}
      {screen === "Feedback Wizard" && <FeedbackWizard activePart={activePart} setActivePart={setActivePart} situation={situation} setSituation={setSituation} />}
      {screen === "Staff Directory" && <StaffDirectory staff={staff} />}
      {screen === "Profile" && <Profile />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
