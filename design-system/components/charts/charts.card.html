const { BarChart, DonutChart, LineChart } = window.BCHousingDesignSystem_3b2feb;
function Demo(){

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <BarChart title="FTE by Branch" xKey="branch" layout="vertical"
        series={[{key:"regular",label:"Regular",color:"var(--chart-1)"},{key:"shortTerm",label:"Short Term",color:"var(--chart-2)"}]}

        {name:"Maintenance",value:5.75,color:"var(--chart-4)"}]} />
