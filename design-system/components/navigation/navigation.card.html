<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="background:var(--surface-page)"></div>
<script type="text/babel">
const { WizardTabs, WizardPanel, Stepper, ProcessTimeline, Sidebar, Button } = window.BCHousingDesignSystem_3b2feb;
function Demo(){
  const [active,setActive]=React.useState(1);
  const parts=[0,1,2].map(i=>({label:`Part ${i+1}`,state:i<active?"complete":i===active?"active":"upcoming"}));
  return (
    <div style={{padding:16,display:"flex",flexDirection:"column",gap:20}}>
      <div>
        <WizardTabs parts={parts} onSelect={i=>i<=active&&setActive(i)} />
        <WizardPanel title="Basic information" footer={<><Button variant="outline">Previous</Button><Button>Next</Button></>}>
          <p style={{margin:0,fontSize:14,color:"var(--text-muted)"}}>Form fields go here.</p>
        </WizardPanel>
      </div>
      <Stepper steps={[{label:"Description",state:"done"},{label:"Stakeholders",state:"done"},{label:"Constraints",state:"current"}]} />
      <ProcessTimeline steps={[{label:"Initiate",state:"done"},{label:"Preliminary",state:"done"},{label:"Report",state:"current"},{label:"Close",state:"pending"}]} />
      <div style={{display:"flex",border:"1px solid var(--border-default)",borderRadius:6,overflow:"hidden"}}>
        <Sidebar activeItem="Standards and Elements" />
        <div style={{flex:1,padding:16,fontSize:13,color:"var(--text-muted)"}}>Content area</div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
