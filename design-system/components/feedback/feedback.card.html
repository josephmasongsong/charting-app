<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:16px;background:var(--surface-page)"></div>
<script type="text/babel">
const { Alert, Modal, Button } = window.BCHousingDesignSystem_3b2feb;
function Demo(){
  const [open,setOpen]=React.useState(false);
  return (
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <Alert variant="validation" title="The form could not be submitted for the following reasons:"><a href="#" onClick={e=>e.preventDefault()}>Purpose is a required field.</a></Alert>
      <Alert variant="destructive">Please download the appeal letter template.</Alert>
      <Alert variant="warning">You have until 12:00AM, July 1 to complete your submission.</Alert>
      <Alert variant="empty">There are no folders or files to display.</Alert>
      <Button onClick={()=>setOpen(true)}>Open confirmation modal</Button>
      <Modal open={open} onClose={()=>setOpen(false)} title="Confirmation for Final Appeal" center
        footer={<><Button variant="outline" onClick={()=>setOpen(false)}>Cancel</Button><Button onClick={()=>setOpen(false)}>Proceed</Button></>}>
        <p>By selecting confirm below, the level of your Appeal will update from Formal to Final.</p>
      </Modal>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
