<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Sign in" description="Full-bleed brand-blue sign-in screen with a centered white card." -->
<helmet>
<script src="./ds-base.js"></script>
<style>html,body{margin:0;padding:0}*{box-sizing:border-box}a{color:var(--action-primary);text-decoration:none}a:hover{color:var(--action-primary-hover);text-decoration:underline}</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px;background:var(--action-primary);font-family:var(--font-sans);color:var(--text-body)">
<div style="width:100%;max-width:480px;background:var(--surface-card);border-radius:var(--radius-card);padding:40px 48px 44px;display:flex;flex-direction:column;align-items:stretch">
<div style="display:flex;align-items:center;justify-content:center;gap:10px">
<img src="../../assets/logo.png" alt="BC Housing" style="width:34px;height:34px;display:block">
<span style="font-size:24px;font-weight:700;letter-spacing:.02em;color:var(--surface-chrome)">BC HOUSING</span>
</div>
<sc-if value="{{ hasAlert }}" hint-placeholder-val="{{ false }}">
<div style="margin-top:24px;background:var(--danger-surface);border-left:5px solid var(--danger);padding:12px 14px;font-size:14px;line-height:1.45">{{ alertMessage }}</div>
</sc-if>
<form style="margin-top:32px;display:flex;flex-direction:column;gap:24px" onSubmit="{{ onSubmit }}">
<div style="display:flex;flex-direction:column;gap:6px">
<label for="signin-email" style="font-size:14.5px;font-weight:600">Email</label>
<x-import component-from-global-scope="BCHousingDesignSystem_3b2feb.Input" id="signin-email" type="email" autoComplete="username" placeholder="Enter your email" hint-size="100%,40px"></x-import>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="signin-password" style="font-size:14.5px;font-weight:600">Password</label>
<x-import component-from-global-scope="BCHousingDesignSystem_3b2feb.Input" id="signin-password" type="password" autoComplete="current-password" placeholder="Enter your password" hint-size="100%,40px"></x-import>
</div>
<button type="submit" style="width:100%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-size:15.5px;font-weight:400;padding:11px 18px;border:1px solid transparent;border-radius:var(--radius-control);background:var(--action-primary);color:#fff;cursor:pointer;transition:background .15s" style-hover="background:var(--action-primary-hover)">Sign in</button>
</form>
<a href="../reset-password/ResetPassword.dc.html" style="margin-top:24px;text-align:center;font-size:14.5px">Forgot your password?</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:854},&quot;alertMessage&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Options&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const alertMessage = this.props.alertMessage ?? "";
    return {
      alertMessage,
      hasAlert: alertMessage.trim().length > 0,
      onSubmit: (e) => { e.preventDefault(); window.location.href = "../dashboard/Dashboard.dc.html"; },
    };
  }
}
</script>
</body>
</html>
