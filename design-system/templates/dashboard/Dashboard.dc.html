<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>

<x-dc>
<!-- @template name="Dashboard" description="Post-sign-in landing: time-filtered KPI cards with trend deltas, primary Quick Start action grid, and a condensed recent-activity rail." -->

<script src="./ds-base.js"></script>
<style>html,body{margin:0;padding:0;background:var(--surface-page)}*{box-sizing:border-box}a{color:var(--action-primary);text-decoration:none}a:hover{color:var(--action-primary-hover);text-decoration:underline}</style>
</helmet>

<div style="width:100%;max-width:1200px;margin:0 auto;padding:32px 24px 48px;flex:1">
<div>
<h1 style="margin:0;font-size:30px;font-weight:700">Dashboard</h1>
<p style="margin:6px 0 0;font-size:15px;color:var(--text-muted)">Welcome back, Joseph Masongsong!</p>
</div>
<div style="margin-top:24px">
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px">
<h2 style="margin:0;font-size:17px;font-weight:700">Needs Attention</h2>
<span style="font-size:13px;color:var(--text-muted)">{{ attentionCount }} items need action</span>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">
<sc-for list="{{ attentionItems }}" as="item" hint-placeholder-count="4">
<sc-if value="{{ item.isUrgent }}" hint-placeholder-val="{{ true }}">
<div style="background:#fff;border:1px solid var(--border-default);border-left:4px solid var(--bch-red-600);border-radius:var(--radius-card);padding:16px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:12px">
<span style="width:38px;height:38px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:var(--danger-surface);color:var(--bch-red-600)"><x-import component-from-global-scope="BCHousingDesignSystem_3b2feb.{{ item.icon }}" size="18" hint-size="18px,18px"></x-import></span>
<div style="min-width:0">
<div style="font-size:14.5px;font-weight:700">{{ item.title }}</div>
<div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">{{ item.sub }}</div>
</div>
</div>
<button onClick="{{ item.onClick }}" style="align-self:flex-start;background:none;border:none;padding:0;font-family:var(--font-sans);font-size:13px;font-weight:700;color:var(--action-primary);cursor:pointer">{{ item.actionLabel }} →</button>
</div>
</sc-if>
<sc-if value="{{ item.isWarning }}" hint-placeholder-val="{{ false }}">
<div style="background:#fff;border:1px solid var(--border-default);border-left:4px solid var(--bch-gold-600);border-radius:var(--radius-card);padding:16px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:12px">
<span style="width:38px;height:38px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#FDF1D3;color:#B07C0A"><x-import component-from-global-scope="BCHousingDesignSystem_3b2feb.{{ item.icon }}" size="18" hint-size="18px,18px"></x-import></span>
<div style="min-width:0">
<div style="font-size:14.5px;font-weight:700">{{ item.title }}</div>
<div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">{{ item.sub }}</div>
</div>
</div>
<button onClick="{{ item.onClick }}" style="align-self:flex-start;background:none;border:none;padding:0;font-family:var(--font-sans);font-size:13px;font-weight:700;color:var(--action-primary);cursor:pointer">{{ item.actionLabel }} →</button>
</div>
</sc-if>
</sc-for>
</div>
</div>
<div style="display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start;margin-top:28px">
<div>
<h2 style="margin:0 0 14px;font-size:18px;font-weight:700">Quick Start</h2>
<div style="display:flex;flex-direction:column;gap:16px">
<sc-for list="{{ quickItems }}" as="qi" hint-placeholder-count="3">
<button onClick="{{ qi.onClick }}" style="display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px;font-family:var(--font-sans);cursor:pointer">
<span style="width:44px;height:44px;flex-shrink:0;border-radius:var(--radius-control);background:var(--action-selected);color:var(--action-primary);display:grid;place-items:center"><x-import component-from-global-scope="BCHousingDesignSystem_3b2feb.{{ qi.icon }}" size="22" hint-size="22px,22px"></x-import></span>
<span style="flex:1;min-width:0">
<span style="display:block;font-size:15.5px;font-weight:700;color:var(--text-body)">{{ qi.label }}</span>
<span style="display:block;font-size:13px;color:var(--text-muted);margin-top:3px">{{ qi.sub }}</span>
</span>
</button>
</sc-for>
</div>
</div>
<x-import component-from-global-scope="BCHousingDesignSystem_3b2feb.ActivityFeed" title="Recent Activity" meta="{{ feedMeta }}" width="100%" items="{{ feedItems }}" page-size="{{ pageSize }}" initial-count="{{ pageSize }}" avatar-size="{{ avatarSize }}" hint-size="100%,640px"></x-import>

</div>
</div>
