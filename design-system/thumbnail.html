<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.wrap{display:flex;width:100%;height:100%;font-family:var(--font-sans)}
.main{flex:1;background:var(--bch-teal-700);display:flex;align-items:center;justify-content:center}
.main span{color:#fff;font-size:96px;font-weight:700;letter-spacing:.5px}
.strip{width:120px;display:flex;flex-direction:column}
.strip div{flex:1}
</style>
</head>
<body>
<div class="wrap">
<div class="main"><span>BC HOUSING</span></div>
<div class="strip">
<div style="background:var(--bch-seafoam)"></div>
<div style="background:var(--bch-sky-400)"></div>
<div style="background:var(--action-primary)"></div>
<div style="background:var(--bch-teal-950)"></div>
</div>
</div>
</body>
</html>
